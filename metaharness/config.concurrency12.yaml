solver:
  provider: deepseek
  model: deepseek-v4-flash
  api_base: https://api.deepseek.com/v1
  api_key_env: SOLVER_API_KEY
  system_prompt: ""
  reasoning_effort: high
  extra_body:
    thinking: {type: enabled}
  temperature: 0.0
  max_tokens: 16384
  context_window: 1048576
  max_model_calls: 32
  timeout_seconds: 900
  request_timeout_seconds: 180
  tool_timeout_seconds: 120

runtime:
  model_concurrency: 12
  parallel_questions: 12
  prepare_timeout_seconds: 900

dataset:
  root: benchmark/data
  tasks: [USPTO]
  seed: 42
  num_epochs: 1
  num_train: 200
  num_val: 50
  num_test: 100
  overrides:
    USPTO: {num_train: 50, num_val: 30, num_test: 100}

evaluation:
  val_samples: 1
  test_samples: 1
