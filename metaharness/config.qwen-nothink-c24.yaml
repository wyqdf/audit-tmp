solver:
  provider: qwen
  model: qwen3.5-flash
  api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
  api_key_env: BAILIAN_API_KEY
  system_prompt: ""
  temperature: 0.0
  max_tokens: 16384
  context_window: 983040
  max_model_calls: 32
  timeout_seconds: 900
  request_timeout_seconds: 90
  client_timeout_seconds: 420
  tool_timeout_seconds: 120
  max_retries: 3
  retry_backoff_seconds: 5
  explicit_cache: true
  extra_body:
    enable_thinking: false

runtime:
  model_concurrency: 24
  parallel_questions: 24
  prepare_timeout_seconds: 900

dataset:
  root: benchmark/data
  tasks: [USPTO, Symptom2Disease, LawBench]
  seed: 42
  num_epochs: 1
  num_train: 200
  num_val: 50
  num_test: 100
  overrides:
    USPTO: {num_train: 50, num_val: 30, num_test: 100}
    Symptom2Disease: {num_train: 200, num_val: 50, num_test: 212}
    LawBench: {num_train: 200, num_val: 50, num_test: 100}

evaluation:
  val_samples: 1
  test_samples: 1
